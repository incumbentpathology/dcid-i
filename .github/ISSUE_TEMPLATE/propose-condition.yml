name: Propose a condition
description: Propose a new condition for the manual.
title: "Condition: "
labels: [condition]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: "Copium maximum"
    validations:
      required: true
  - type: textarea
    id: sign
    attributes:
      label: Essential feature
      description: One plain sentence.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Diagnostic criteria
      description: Lettered criteria (A, B, C...), with numbered signs where a threshold applies ("three or more of the following").
    validations:
      required: true
  - type: textarea
    id: specifiers
    attributes:
      label: Specifiers
      description: Severity, type, insight, course.
  - type: textarea
    id: differential
    attributes:
      label: Differential diagnosis
      description: Conditions and ordinary business behavior this could be mistaken for, and how to tell them apart.
    validations:
      required: true
  - type: textarea
    id: case
    attributes:
      label: Case note
      description: At least one illustrative case, patient recorded by type.
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related findings
      placeholder: "F67.4"
