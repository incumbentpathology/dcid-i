name: Report a case
description: Submit a case report on an incumbent patient.
title: "Case: "
labels: [case]
body:
  - type: markdown
    attributes:
      value: "Record the patient by type, never by name. Paraphrase; do not quote exactly enough to identify the author. Submissions that name a company will be closed. The full template is in cases/_template.md."
  - type: input
    id: findings
    attributes:
      label: Findings
      description: Codes and specifiers.
      placeholder: "F62.20 Ave Maria, commercial type, runway 6 weeks"
    validations:
      required: true
  - type: textarea
    id: patient
    attributes:
      label: Patient information
      description: Category, age band, size band, ownership, presenting through.
      placeholder: "A workflow-software incumbent; 10–20 years; 500–5,000; venture-backed; presenting through an earnings call."
    validations:
      required: true
  - type: textarea
    id: complaint
    attributes:
      label: Presenting complaint
      description: What the patient said or did that brought it to attention.
    validations:
      required: true
  - type: textarea
    id: history
    attributes:
      label: History
      description: History of present illness, and past history (prior pivots, rebrands, acquisitions, prior episodes).
  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: Dated events with sources.
  - type: textarea
    id: mse
    attributes:
      label: Mental status examination
      description: Appearance, behavior, speech, mood, affect, thought process, thought content, orientation, insight, judgment.
  - type: textarea
    id: assessment
    attributes:
      label: Diagnostic assessment
      description: Criteria met for each finding, with the evidence for each. Differential diagnoses considered and excluded.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Intervention and outcome
      description: What the patient did, what the clinician would prescribe, and what happened next.
  - type: textarea
    id: discussion
    attributes:
      label: Discussion
      description: The doctor's interpretation, marked as an inference.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Public sources consulted.
